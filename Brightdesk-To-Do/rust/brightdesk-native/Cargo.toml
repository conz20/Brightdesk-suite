[package]
name = "brightdesk-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Node-API bridge for Brightdesk Office Suite"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
brightdesk-core = { path = "../brightdesk-core" }
napi = { version = "=3.16.1", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.7.0"

[build-dependencies]
napi-build = "=2.6.0"

[lints]
workspace = true

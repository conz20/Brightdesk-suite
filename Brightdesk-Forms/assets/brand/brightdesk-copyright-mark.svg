<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Brightdesk copyright mark</title>
  <desc id="desc">A refined copyright symbol in a circular Brightdesk navy and gradient emblem.</desc>
  <defs>
    <linearGradient id="brightdesk-ring" x1="18" y1="18" x2="142" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#53C8E8"/>
      <stop offset=".52" stop-color="#7868E8"/>
      <stop offset="1" stop-color="#43B9A7"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="72" fill="#101B35"/>
  <circle cx="80" cy="80" r="66" fill="none" stroke="url(#brightdesk-ring)" stroke-width="5"/>
  <circle cx="80" cy="80" r="56" fill="none" stroke="#64748B" stroke-opacity=".55" stroke-width="1.5"/>
  <text x="80" y="105" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="91" font-weight="600" fill="#FFFFFF">©</text>
</svg>

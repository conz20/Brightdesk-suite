name: Temporary Mac cross-build tool check

on:
  push:
    branches:
      - diagnostics/mac-runner-readonly-2026-11-07
    paths:
      - .github/workflows/diagnose-cross-build-tools.yml

permissions:
  contents: read

concurrency:
  group: brightdesk-mac-cross-build-readonly-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    name: Check existing cross-build tools
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Inspect existing tools only
        shell: bash
        run: |
          set +e
          echo "=== Platform ==="
          uname -s
          uname -m
          sw_vers -productVersion

          echo "=== Tool availability ==="
          for tool in docker podman wine brew appimagetool fpm dpkg-deb fakeroot rpmbuild hdiutil pkgbuild productbuild zip; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%s=available (%s)\n' "$tool" "$(command -v "$tool")"
            else
              printf '%s=not_found\n' "$tool"
            fi
          done

          echo "=== Docker read-only status ==="
          if command -v docker >/dev/null 2>&1; then
            docker --version
            docker info --format 'docker_server={{.OSType}}/{{.Architecture}}' 2>/dev/null || echo "docker_daemon=not_accessible"
          fi

          echo "=== Podman read-only status ==="
          if command -v podman >/dev/null 2>&1; then
            podman --version
            podman info --format 'podman_os={{.Host.OS}}' 2>/dev/null || echo "podman_service=not_accessible"
          fi

          echo "=== Wine read-only status ==="
          if command -v wine >/dev/null 2>&1; then
            wine --version
          fi

          echo "=== Xcode tools ==="
          xcode-select -p 2>/dev/null || echo "xcode_tools=not_available"

          echo "=== Existing package manager ==="
          if command -v brew >/dev/null 2>&1; then
            brew --version | head -n 1
          fi

name: Brightdesk feature quality checks

on:
  push:
    branches:
      - feature/brightdesk-original-suite-experience
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'PRODUCT_SCOPE_LOCK.md'
      - 'README.md'
      - '.github/workflows/brightdesk-feature-quality.yml'
  pull_request:
    branches:
      - main
      - feature/complete-suite-launcher-apps
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brightdesk-feature-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify Brightdesk source and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the required Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          cache: npm

      - name: Verify the required runtime
        run: npm run check:node

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify the dependency lock
        run: npm run lock:verify

      - name: Verify third-party licence notices
        run: npm run verify:licenses

      - name: Check key JavaScript entry points
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/app.js
          node --check src/app-catalog.js
          node --check src/release-manifest.js
          node --check src/app-update-service.js
          node --check src/update-preferences.js
          node --check src/standalone-app-discovery.js
          node --check src/standalone-app-registry.js
          node --check src/standalone-update-manager.js
          node --check scripts/generate-release-manifest.js

      - name: Run the complete test suite
        run: npm test

      - name: Check release configuration
        run: npm run release:preflight

      - name: Block high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

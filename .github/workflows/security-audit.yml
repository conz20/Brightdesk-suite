name: Security and dependency audit

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify dependency lock
        run: npm run lock:verify
      - name: Verify third-party licence notices
        run: npm run verify:licenses
      - name: Run automated tests
        run: npm test
      - name: Audit dependencies for high severity vulnerabilities
        run: npm audit --audit-level=high

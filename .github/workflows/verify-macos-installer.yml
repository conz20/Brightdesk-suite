name: Verify Brightdesk native installers

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tests/dependency-security.test.js"
      - "scripts/prepare-release-assets.js"
      - "scripts/verify-release-artifacts.js"
      - "electron-builder.app.config.js"
      - "scripts/build-app.js"
      - "scripts/build-apps.js"
      - "scripts/verify-product-installers.js"
      - "scripts/verify-complete-release-bundle.js"
      - "scripts/collect-platform-build.js"
      - "tests/ten-product-release-bundle.test.js"
      - "tests/release-workflows.test.js"
      - ".github/workflows/build-release.yml"
      - ".github/workflows/verify-macos-installer.yml"

permissions:
  contents: read

concurrency:
  group: brightdesk-native-installers-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-platform:
    name: Build and verify ${{ matrix.platform }} Suite and product installers
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            script: linux
          - platform: Windows
            runner: windows-latest
            script: win
          - platform: macOS
            runner: ["self-hosted", "macOS", "ARM64"]
            script: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action revision
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Verify committed dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Suite installer
        if: matrix.platform != 'macOS'
        run: |
          npm run dist:${{ matrix.script }}
          npm run release:prepare -- ${{ matrix.script }}

      - name: Build macOS universal Suite installer
        if: matrix.platform == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run dist:mac
          npm run release:prepare -- mac

      - name: Verify Suite installer files and generate SHA-256 checksums
        run: npm run release:verify:${{ matrix.script }}

      - name: Build all ten product installers on the native platform
        if: matrix.platform != 'macOS'
        run: npm run dist:products:${{ matrix.script }}

      - name: Build all ten macOS product installers
        if: matrix.platform == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:products:mac

      - name: Verify all ten product installers and their SHA-256 manifests
        run: npm run release:verify:products:${{ matrix.script }}

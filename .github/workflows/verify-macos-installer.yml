name: Verify Brightdesk macOS installer

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tests/dependency-security.test.js"
      - "scripts/prepare-release-assets.js"
      - "scripts/verify-release-artifacts.js"
      - ".github/workflows/verify-macos-installer.yml"

permissions:
  contents: read

concurrency:
  group: brightdesk-macos-installer-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build and verify macOS universal installer
    runs-on: ${{ github.event.repository.private == false && 'macos-15' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 90
    steps:
      - name: Register post-job workspace cleanup
        if: runner.environment == 'self-hosted'
        uses: conz20/Brightdesk-suite/.github/actions/runner-workspace-cleanup@7727da85c4e6e660f3376b5b330d78b6782c1976

      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action revision
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build macOS universal DMG, PKG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run dist:mac
          npm run release:prepare -- mac

      - name: Verify installer files and generate SHA-256 checksums
        run: npm run release:verify:mac

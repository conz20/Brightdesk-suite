name: Brightdesk Suite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brightdesk-suite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Reuse the already-configured private Mac runner; avoid paid hosted-runner usage.
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm

      - name: Verify Node.js runtime
        run: npm run check:node

      - name: Verify dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify third-party licence notices
        run: npm run verify:licenses
      - name: Verify pinned product source parity
        run: npm run verify:product-sources

      - name: Build the approved product workspaces
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

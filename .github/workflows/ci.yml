name: Brightdesk Suite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brightdesk-suite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted macOS keeps integration checks independent of the owner's MacBook.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      - name: Verify Node.js runtime
        run: npm run check:node

      - name: Verify dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify third-party licence notices
        run: npm run verify:licenses

      - name: Build the approved product workspaces
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Capture current Electron Suite and integrated product workspaces
        id: screenshot-capture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          BRIGHTDESK_SCREENSHOT_OUTPUT_DIR: ${{ runner.temp }}/brightdesk-screenshots
          GITHUB_SHA: ${{ github.sha }}
        run: npm run capture:screenshots

      - name: Upload pending-review screenshot evidence
        if: steps.screenshot-capture.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Brightdesk-Screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/brightdesk-screenshots/*
          if-no-files-found: error
          retention-days: 14

  linux-native:
    name: Validate native engine and full Suite tests on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.1
          components: rustfmt, clippy

      - name: Verify Node.js runtime and dependency lock
        run: |
          npm run check:node
          npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify third-party licence notices
        run: npm run verify:licenses

      - name: Check Rust formatting, lint and unit tests
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Build the Linux native Node-API engine
        run: npm run native:build

      - name: Build and type-check approved product workspaces
        run: |
          npm run build
          npm run typecheck

      - name: Run all tests with the native engine required
        env:
          BRIGHTDESK_REQUIRE_NATIVE_ENGINE: "1"
        run: npm test

      - name: Verify release readiness
        run: npm run release:preflight

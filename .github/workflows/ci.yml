name: Brightdesk Suite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brightdesk-suite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Reuse the already-configured private Mac runner; avoid paid hosted-runner usage.
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Register post-job workspace cleanup
        uses: conz20/Brightdesk-suite/.github/actions/runner-workspace-cleanup@7727da85c4e6e660f3376b5b330d78b6782c1976

      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Verify Node.js runtime
        run: npm run check:node

      - name: Verify dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify third-party licence notices
        run: npm run verify:licenses

      - name: Build the approved product workspaces
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Capture optional Suite and product source-runtime screenshots
        id: guide_screenshots
        continue-on-error: true
        env:
          BRIGHTDESK_STARTUP_SMOKE_TEST: '1'
          BRIGHTDESK_GUIDE_SCREENSHOT_MODE: '1'
          BRIGHTDESK_GUIDE_SCREENSHOT_DIR: ${{ runner.temp }}/brightdesk-guide-screenshots-${{ github.run_id }}
          BRIGHTDESK_GUIDE_DATA_DIR: ${{ runner.temp }}/brightdesk-guide-profile-${{ github.run_id }}
        run: |
          rm -rf "$BRIGHTDESK_GUIDE_SCREENSHOT_DIR" "$BRIGHTDESK_GUIDE_DATA_DIR"
          npx electron .

      - name: Upload Suite and product source-runtime screenshots
        if: steps.guide_screenshots.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brightdesk-guide-screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/brightdesk-guide-screenshots-${{ github.run_id }}/*.png
          if-no-files-found: error
          retention-days: 14

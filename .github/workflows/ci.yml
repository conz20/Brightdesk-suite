name: Brightdesk Suite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brightdesk-suite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Reuse the already-configured private Mac runner; avoid paid hosted-runner usage.
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Register post-job workspace cleanup
        uses: conz20/Brightdesk-suite/.github/actions/runner-workspace-cleanup@7727da85c4e6e660f3376b5b330d78b6782c1976

      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Verify Node.js runtime
        run: npm run check:node

      - name: Check available cross-platform build tools
        shell: bash
        run: |
          printf 'Host OS: '; uname -s
          printf 'Host architecture: '; uname -m
          printf 'Node architecture: '; node -p 'process.platform + "/" + process.arch'
          for tool in wine wine64 docker podman qemu-system-x86_64 qemu-system-aarch64 x86_64-w64-mingw32-gcc x86_64-linux-gnu-gcc; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf 'AVAILABLE %s: ' "$tool"
              "$tool" --version 2>&1 | head -n 1 || true
            else
              printf 'MISSING %s\n' "$tool"
            fi
          done
          if command -v docker >/dev/null 2>&1; then
            printf 'Docker daemon: '
            docker info --format '{{.OSType}}/{{.Architecture}}' 2>/dev/null || printf 'unavailable\n'
          fi
          if command -v rustup >/dev/null 2>&1; then
            printf 'Installed Rust targets:\n'
            rustup target list --installed
          fi


      - name: Verify dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify third-party licence notices
        run: npm run verify:licenses

      - name: Build the approved product workspaces
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

name: Brightdesk daily product quality checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'installer/**'
      - 'docs/**'
      - 'PRODUCT_SCOPE_LOCK.md'
      - 'TERMS_AND_CONDITIONS.txt'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'installer/**'
      - 'docs/**'
      - 'PRODUCT_SCOPE_LOCK.md'
      - 'TERMS_AND_CONDITIONS.txt'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/**'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brightdesk-daily-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, audit and verify release readiness
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the required Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm

      - name: Prepare the exact dependency lock
        run: npm run lock:prepare

      - name: Verify the dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify third-party licences
        run: npm run verify:licenses

      - name: Run every automated test
        run: npm test

      - name: Verify product and release configuration
        run: npm run release:preflight

      - name: Block high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

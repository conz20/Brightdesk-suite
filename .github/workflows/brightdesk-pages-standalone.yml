name: Brightdesk Pages standalone checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.app.config.js'
      - '.github/workflows/brightdesk-pages-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Brightdesk Pages standalone package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run Pages standalone contract test
        run: node --test tests/standalone-pages.test.js
      - name: Prepare repository seed and verify Pages seed
        run: npm run repositories:prepare
      - name: Verify Pages seed is locked to Pages
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join('release', 'app-repository-seeds', 'Brightdesk-Pages');
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          if (pkg.name !== 'brightdesk-pages') throw new Error(`Unexpected package name: ${pkg.name}`);
          if (pkg.brightdeskAppId !== 'pages') throw new Error(`Unexpected app ID: ${pkg.brightdeskAppId}`);
          if (pkg.build?.appId !== 'org.brightdesk.pages') throw new Error(`Unexpected Electron app ID: ${pkg.build?.appId}`);
          if (pkg.build?.productName !== 'Brightdesk Pages') throw new Error(`Unexpected product name: ${pkg.build?.productName}`);
          if (!fs.existsSync(path.join(root, 'assets', 'brightdesk-app.svg'))) throw new Error('Pages artwork is missing.');
          if (!fs.existsSync(path.join(root, '.github', 'workflows', 'standalone-app.yml'))) throw new Error('Pages standalone workflow is missing.');
          console.log('Brightdesk Pages standalone seed verified.');
          NODE

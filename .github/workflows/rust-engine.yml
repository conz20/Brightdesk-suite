name: Brightdesk Rust engine
on:
  push:
    branches: [main, "feature/**"]
    paths: ["rust/**", "scripts/rust-engine.mjs", "test/rust-engine.test.mjs", ".github/workflows/rust-engine.yml"]
  pull_request:
    paths: ["rust/**", "scripts/rust-engine.mjs", "test/rust-engine.test.mjs", ".github/workflows/rust-engine.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brightdesk-rust-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: actions/setup-node@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          node-version: "24.22.2"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Run Rust lint
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Build Rust engine
        run: cargo build --manifest-path rust/Cargo.toml --workspace --release
      - name: Run Node bridge tests
        run: node --test test/rust-engine.test.mjs

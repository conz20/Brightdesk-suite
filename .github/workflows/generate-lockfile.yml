name: Generate dependency lockfile

on:
  push:
    branches: [main, security/vitest-5-vite-6-upgrade-2026-11-05]
    paths:
      - 'package.json'
      - '.github/workflows/generate-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'

      - name: Verify the required Node.js runtime
        run: npm run check:node

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile
        run: npm ls --package-lock-only --depth=0

      - name: Create lockfile update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json was not generated." >&2
            exit 1
          fi
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          BRANCH="automation/lockfile-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate package-lock.json for Brightdesk v${VERSION}"
          git push --set-upstream origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Update Brightdesk dependency lockfile" \
            --body "Automated dependency lockfile update. Please review the lockfile diff and CI results before merging."

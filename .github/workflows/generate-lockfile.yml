name: Generate dependency lockfile

on:
  push:
    branches: [main, security/vitest-5-vite-6-upgrade-2026-11-05]
    paths:
      - 'package.json'
      - '.github/workflows/generate-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'

      - name: Verify the required Node.js runtime
        run: npm run check:node

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile
        run: npm ls --package-lock-only --depth=0

      - name: Commit lockfile
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              VERSION="$(node -p "require('./package.json').version")"
              git commit -m "Generate package-lock.json for Brightdesk v${VERSION}"
              git push
            else
              echo "package-lock.json is already up to date."
            fi
          else
            echo "package-lock.json was not generated." >&2
            exit 1
          fi

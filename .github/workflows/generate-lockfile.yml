name: Generate dependency lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/generate-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up required Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile
        run: npm ls --package-lock-only --depth=0

      - name: Commit lockfile
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "Generate package-lock.json for v0.1.0"
              git push
            else
              echo "package-lock.json is already up to date."
            fi
          else
            echo "package-lock.json was not generated." >&2
            exit 1
          fi

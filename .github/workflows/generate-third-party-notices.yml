name: Generate third-party notices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - "scripts/verify-licenses.js"
      - ".github/workflows/generate-third-party-notices.yml"

permissions:
  contents: read

jobs:
  notices:
    permissions:
      contents: write
    runs-on: self-hosted
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Prepare exact dependency lock
        run: npm run lock:prepare
      - name: Verify dependency lock
        run: npm run lock:verify
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate and verify third-party notices
        run: npm run verify:licenses
      - name: Commit generated notices
        run: |
          git add THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "Third-party notices are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate third-party dependency notices"
          git push

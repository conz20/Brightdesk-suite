name: Generate third-party notices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - "scripts/verify-licenses.js"
      - ".github/workflows/generate-third-party-notices.yml"

permissions:
  contents: read

jobs:
  notices:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Prepare exact dependency lock
        run: npm run lock:prepare
      - name: Verify dependency lock
        run: npm run lock:verify
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate and verify third-party notices
        run: npm run verify:licenses
      - name: Commit generated notices
        run: |
          git add THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "Third-party notices are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate third-party dependency notices"
          git push

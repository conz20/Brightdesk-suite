name: Generate third-party notices

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - "scripts/verify-licenses.js"
      - ".github/workflows/generate-third-party-notices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notices:
    permissions:
      contents: write
    runs-on: self-hosted
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Commit generated notices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another main-branch workflow may update package-lock.json while this
          # job is running. Always regenerate from the latest main commit.
          for attempt in 1 2 3; do
            echo "Refreshing third-party notices (attempt ${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            npm run check:node
            npm run lock:verify
            npm ci --ignore-scripts --no-audit --no-fund
            npm run verify:licenses
            git add THIRD_PARTY_NOTICES.md

            if git diff --cached --quiet; then
              echo "Third-party notices are already up to date."
              exit 0
            fi

            git commit -m "Generate third-party dependency notices"
            if git push origin HEAD:main; then
              echo "Third-party notices were committed successfully."
              exit 0
            fi

            echo "main changed during the push; retrying against the latest commit."
          done

          echo "Could not update THIRD_PARTY_NOTICES.md after three attempts." >&2
          exit 1

name: Brightdesk To Do checks

on:
  push:
    branches: [feature/brightdesk-todo]
    paths:
      - 'src/todo-service.js'
      - 'src/app.js'
      - 'src/index.html'
      - 'src/styles.css'
      - 'src/app-catalog.js'
      - 'tests/todo-service.test.js'
      - 'tests/todo-ui-integration.test.js'
      - '.github/workflows/todo-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test To Do task behaviour
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check renderer JavaScript syntax
        run: node --check src/app.js
      - name: Run automated tests
        run: npm test

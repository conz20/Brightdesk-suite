name: Build and verify Brightdesk installers

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release after all installers pass verification'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: brightdesk-installer-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Test and lock dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up required Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm

      - name: Prepare exact dependency lock
        run: npm run lock:prepare

      - name: Verify dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify third-party licence notices
        run: npm run verify:licenses

      - name: Run automated test suite
        run: npm test

      - name: Check release readiness
        run: npm run release:preflight

      - name: Audit dependencies for high severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Save the exact dependency lock used for this release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brightdesk-dependency-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }} installer
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            script: linux
          - platform: Windows
            runner: windows-latest
            script: win
          - platform: macOS
            runner: macos-latest
            script: mac
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up required Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm

      - name: Restore the exact dependency lock
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brightdesk-dependency-lock
          path: .

      - name: Verify dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build suite installer
        env:
          WIN_CSC_LINK: ${{ github.event_name != 'pull_request' && matrix.platform == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          MAC_APP_CSC_LINK: ${{ github.event_name != 'pull_request' && matrix.platform == 'macOS' && secrets.MAC_APP_CSC_LINK || '' }}
          MAC_INSTALLER_CSC_LINK: ${{ github.event_name != 'pull_request' && matrix.platform == 'macOS' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          CSC_LINK: ${{ github.event_name != 'pull_request' && matrix.platform == 'Windows' && secrets.WIN_CSC_LINK || github.event_name != 'pull_request' && matrix.platform == 'macOS' && secrets.MAC_APP_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && matrix.platform == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || github.event_name != 'pull_request' && matrix.platform == 'macOS' && secrets.MAC_APP_CSC_KEY_PASSWORD || '' }}
          CSC_INSTALLER_LINK: ${{ github.event_name != 'pull_request' && matrix.platform == 'macOS' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && matrix.platform == 'macOS' && secrets.MAC_INSTALLER_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && matrix.platform == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name != 'pull_request' && matrix.platform == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && matrix.platform == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${CSC_INSTALLER_LINK:-}" ]; then unset CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD; fi
          if [ "${{ matrix.platform }}" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          if [ "${{ matrix.script }}" = "linux" ]; then npm run dist:linux; fi
          if [ "${{ matrix.script }}" = "win" ]; then npm run dist:win; fi
          if [ "${{ matrix.script }}" = "mac" ]; then npm run dist:mac; fi
          npm run release:prepare -- ${{ matrix.script }}

      - name: Verify Linux installer artifacts
        if: matrix.platform == 'Linux'
        run: npm run release:verify:linux

      - name: Verify Windows installer artifacts
        if: matrix.platform == 'Windows'
        run: npm run release:verify:win

      - name: Verify macOS installer artifacts
        if: matrix.platform == 'macOS'
        run: npm run release:verify:mac

      - name: Place verified files in platform folder
        shell: bash
        env:
          BRIGHTDESK_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "release/$BRIGHTDESK_PLATFORM"
          node -e "const fs=require('node:fs');const p=require('node:path');const root='release';const dest=p.join(root,process.env.BRIGHTDESK_PLATFORM);for(const name of fs.readdirSync(root)){if(name===process.env.BRIGHTDESK_PLATFORM)continue;const source=p.join(root,name);if(fs.statSync(source).isFile())fs.renameSync(source,p.join(dest,name));}"

      - name: Upload verified platform build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brightdesk-${{ matrix.platform }}
          path: release/${{ matrix.platform }}/**
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Collect verified installers
    needs: [prepare, build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Download verified Linux build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brightdesk-Linux
          path: release/Linux

      - name: Download verified Windows build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brightdesk-Windows
          path: release/Windows

      - name: Download verified macOS build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brightdesk-macOS
          path: release/macOS

      - name: Download the exact dependency lock used for this release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brightdesk-dependency-lock
          path: release/build-metadata

      - name: Read the official product version
        id: release-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload complete Brightdesk installer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brightdesk-${{ steps.release-version.outputs.version }}-Installers
          path: release/**/**
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release (manual approval only)
    needs: collect
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download complete verified installer bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Brightdesk-${{ needs.collect.outputs.version }}-Installers
          path: release

      - name: Publish verified installer files
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.collect.outputs.version }}
          name: Brightdesk ${{ needs.collect.outputs.version }}
          generate_release_notes: true
          files: release/**/**

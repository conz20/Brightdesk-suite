name: Build and verify Brightdesk installers
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release after all installers pass verification'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: brightdesk-installer-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-candidate:
    name: Build and verify macOS, Windows and Linux packages
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 360
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action revision
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Verify the committed dependency lock
        run: npm run lock:verify
      - name: Install locked macOS dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Rust formatting, lint and unit tests
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --workspace --locked
      - name: Verify third-party licence notices
        run: npm run verify:licenses
      - name: Run automated test suite
        run: npm test
      - name: Check release readiness
        run: npm run release:preflight
      - name: Audit dependencies for high severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Build and verify the universal macOS Suite installer
        env:
          CSC_LINK: ${{ github.ref == 'refs/heads/main' && secrets.MAC_APP_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.MAC_APP_CSC_KEY_PASSWORD || '' }}
          CSC_INSTALLER_LINK: ${{ github.ref == 'refs/heads/main' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.MAC_INSTALLER_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          if [ -z "${CSC_INSTALLER_LINK:-}" ]; then unset CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD; fi
          npm run dist:mac
          npm run release:prepare -- mac
          npm run release:verify:mac
      - name: Build and verify all ten macOS product installers
        env:
          CSC_LINK: ${{ github.ref == 'refs/heads/main' && secrets.MAC_APP_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.MAC_APP_CSC_KEY_PASSWORD || '' }}
          CSC_INSTALLER_LINK: ${{ github.ref == 'refs/heads/main' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.MAC_INSTALLER_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          if [ -z "${CSC_INSTALLER_LINK:-}" ]; then unset CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD; fi
          npm run dist:products:mac
          npm run release:verify:products:mac
          npm run release:collect:mac
      - name: Preserve the exact committed dependency lock in release metadata
        run: |
          mkdir -p release/build-metadata
          cp package-lock.json release/build-metadata/package-lock.json
      - name: Build and verify Linux and Windows packages in the no-cost x86_64 container
        env:
          WIN_CSC_LINK: ${{ github.ref == 'refs/heads/main' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: npm run release:cross-platform
      - name: Verify all 66 Suite and product installer/archive files and checksums
        run: npm run release:verify:complete -- release
      - name: Read the official product version
        id: release-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish verified installer files
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.release-version.outputs.version }}
          name: Brightdesk ${{ steps.release-version.outputs.version }}
          generate_release_notes: true
          files: release/**/**

name: Build and verify Brightdesk installers

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

concurrency:
  group: brightdesk-installer-build-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Test and lock dependencies
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Register post-job workspace cleanup
        uses: conz20/Brightdesk-suite/.github/actions/runner-workspace-cleanup@7727da85c4e6e660f3376b5b330d78b6782c1976

      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action revision
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Verify the committed dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Rust formatting, lint and unit tests
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --workspace --locked

      - name: Verify third-party licence notices
        run: npm run verify:licenses

      - name: Run automated test suite
        run: npm test

      - name: Check release readiness
        run: npm run release:preflight

      - name: Audit dependencies for high severity vulnerabilities
        run: npm audit --audit-level=high

  build:
    name: Build and verify ${{ matrix.platform }} installer
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ["self-hosted", "Linux", "X64"]
            script: linux
          - platform: Windows
            runner: ["self-hosted", "Windows", "X64"]
            script: win
          - platform: macOS
            runner: ["self-hosted", "macOS", "ARM64"]
            script: mac
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Register post-job workspace cleanup
        uses: conz20/Brightdesk-suite/.github/actions/runner-workspace-cleanup@7727da85c4e6e660f3376b5b330d78b6782c1976

      - name: Check out Brightdesk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action revision
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Verify dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Suite and all ten standalone product installers
        env:
          WIN_CSC_LINK: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          MAC_APP_CSC_LINK: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'macOS' && secrets.MAC_APP_CSC_LINK || '' }}
          MAC_INSTALLER_CSC_LINK: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'macOS' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          CSC_LINK: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'Windows' && secrets.WIN_CSC_LINK || (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'macOS' && secrets.MAC_APP_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'macOS' && secrets.MAC_APP_CSC_KEY_PASSWORD || '' }}
          CSC_INSTALLER_LINK: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'macOS' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'macOS' && secrets.MAC_INSTALLER_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && matrix.platform == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${CSC_INSTALLER_LINK:-}" ]; then unset CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD; fi
          if [ "${{ matrix.platform }}" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          if [ "${{ matrix.script }}" = "linux" ]; then npm run dist:linux && npm run dist:apps:linux; fi
          if [ "${{ matrix.script }}" = "win" ]; then npm run dist:win && npm run dist:apps:win; fi
          if [ "${{ matrix.script }}" = "mac" ]; then npm run dist:mac && npm run dist:apps:mac; fi
          npm run release:prepare -- ${{ matrix.script }}

      - name: Require and test native Rust engine on this platform
        shell: bash
        env:
          BRIGHTDESK_REQUIRE_NATIVE_ENGINE: "1"
        run: node --test test/rust-engine.test.mjs test/embedding-bridge.test.mjs

      - name: Verify Linux suite and product installers
        if: matrix.platform == 'Linux'
        run: |
          npm run release:verify:linux
          npm run release:verify:products:linux

      - name: Verify Windows suite and product installers
        if: matrix.platform == 'Windows'
        run: |
          npm run release:verify:win
          npm run release:verify:products:win

      - name: Verify macOS suite and product installers
        if: matrix.platform == 'macOS'
        run: |
          npm run release:verify:mac
          npm run release:verify:products:mac

  prepare-release:
    name: Prepare unpublished Brightdesk release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    permissions:
      contents: write
    steps:
      - name: Register post-job workspace cleanup
        uses: conz20/Brightdesk-suite/.github/actions/runner-workspace-cleanup@7727da85c4e6e660f3376b5b330d78b6782c1976

      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Require the exact package version tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v$VERSION"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Refusing release: expected $EXPECTED_TAG, received $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Create the unpublished release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Brightdesk ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true

  release-assets:
    name: Build and attach verified ${{ matrix.platform }} release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ["self-hosted", "Linux", "X64"]
            script: linux
          - platform: Windows
            runner: ["self-hosted", "Windows", "X64"]
            script: win
          - platform: macOS
            runner: ["self-hosted", "macOS", "ARM64"]
            script: mac
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Register post-job workspace cleanup
        uses: conz20/Brightdesk-suite/.github/actions/runner-workspace-cleanup@7727da85c4e6e660f3376b5b330d78b6782c1976

      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up required Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action revision
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Verify dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Suite and all ten standalone product installers
        env:
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          MAC_APP_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macOS' && secrets.MAC_APP_CSC_LINK || '' }}
          MAC_INSTALLER_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macOS' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'Windows' && secrets.WIN_CSC_LINK || startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macOS' && secrets.MAC_APP_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macOS' && secrets.MAC_APP_CSC_KEY_PASSWORD || '' }}
          CSC_INSTALLER_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macOS' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macOS' && secrets.MAC_INSTALLER_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${CSC_INSTALLER_LINK:-}" ]; then unset CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD; fi
          if [ "${{ matrix.platform }}" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          if [ "${{ matrix.script }}" = "linux" ]; then npm run dist:linux && npm run dist:apps:linux; fi
          if [ "${{ matrix.script }}" = "win" ]; then npm run dist:win && npm run dist:apps:win; fi
          if [ "${{ matrix.script }}" = "mac" ]; then npm run dist:mac && npm run dist:apps:mac; fi
          npm run release:prepare -- ${{ matrix.script }}

      - name: Require and test native Rust engine on this platform
        shell: bash
        env:
          BRIGHTDESK_REQUIRE_NATIVE_ENGINE: "1"
        run: node --test test/rust-engine.test.mjs test/embedding-bridge.test.mjs

      - name: Verify Linux suite and product installers
        if: matrix.platform == 'Linux'
        run: |
          npm run release:verify:linux
          npm run release:verify:products:linux

      - name: Verify Windows suite and product installers
        if: matrix.platform == 'Windows'
        run: |
          npm run release:verify:win
          npm run release:verify:products:win

      - name: Verify macOS suite and product installers
        if: matrix.platform == 'macOS'
        run: |
          npm run release:verify:mac
          npm run release:verify:products:mac

      - name: Place verified files in platform folder
        shell: bash
        env:
          BRIGHTDESK_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "release/$BRIGHTDESK_PLATFORM"
          node -e "const fs=require('node:fs');const p=require('node:path');const root='release';const dest=p.join(root,process.env.BRIGHTDESK_PLATFORM);for(const name of fs.readdirSync(root)){if(name===process.env.BRIGHTDESK_PLATFORM)continue;const source=p.join(root,name);if(fs.statSync(source).isFile())fs.renameSync(source,p.join(dest,name));}"
          if [ "$BRIGHTDESK_PLATFORM" = "macOS" ]; then
            mkdir -p release/macOS/build-metadata
            cp package-lock.json release/macOS/build-metadata/package-lock.json
          fi

      - name: Attach verified platform files to the unpublished release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            release/${{ matrix.platform }}/**
          fail_on_unmatched_files: true
          overwrite_files: true

  publish-release:
    name: Publish the verified Brightdesk release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-assets
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    permissions:
      contents: write
    steps:
      - name: Publish after all platform files have been attached
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Brightdesk ${{ github.ref_name }}
          draft: false
          generate_release_notes: true

name: Build and verify Brightdesk installers

on:
  push:
    branches: [main, feature/standalone-downloads-all-ten]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'installer/**'
      - 'tests/**'
      - 'electron-builder.app.config.js'
      - 'TERMS_AND_CONDITIONS.txt'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build-release.yml'
      - '.github/docker/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified Brightdesk 0.1.0 installers as a GitHub Release
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag to publish after verification
        type: string
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: brightdesk-installer-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Test, build, verify and collect all Brightdesk installers
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 300
    steps:
      - name: Check out Brightdesk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up required Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm

      - name: Detect and expose Docker Desktop CLI
        shell: bash
        run: |
          set -euo pipefail
          docker_directory=""
          for candidate in "$HOME/.docker/bin" /Applications/Docker.app/Contents/Resources/bin /usr/local/bin /opt/homebrew/bin; do
            if [ -x "$candidate/docker" ]; then
              docker_directory="$candidate"
              break
            fi
          done
          if [ -z "$docker_directory" ]; then
            echo "Docker Desktop CLI was not found in the standard macOS locations." >&2
            exit 1
          fi
          echo "$docker_directory" >> "$GITHUB_PATH"
          export PATH="$docker_directory:$PATH"
          docker version

      - name: Prepare exact dependency lock
        run: npm run lock:prepare

      - name: Verify dependency lock
        run: npm run lock:verify

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify third-party licence notices
        run: npm run verify:licenses

      - name: Run automated test suite
        run: npm test

      - name: Prepare the ten product repository folders
        run: npm run repositories:prepare

      - name: Check release readiness
        run: npm run release:preflight

      - name: Audit dependencies for high severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Upload the ten prepared product repository folders
        id: product-folders-artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brightdesk-Product-Repositories-0.1.0
          path: release/product-repository-folders/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Report optional artifact upload status
        if: steps.product-folders-artifact.outcome == 'failure'
        run: echo "::warning::GitHub artifact storage is currently full. Product folders remain in the build workspace; continuing with installer builds."

      - name: Build pinned Linux cross-build image
        run: docker build --platform linux/amd64 --pull --tag brightdesk-electron-builder:24.22.2-linux --file .github/docker/electron-builder.Dockerfile .

      - name: Verify pinned Linux build image
        run: docker run --rm --platform linux/amd64 --entrypoint /bin/bash brightdesk-electron-builder:24.22.2-linux -lc 'node --version'

      - name: Build Windows cross-build image with Wine 10.4
        run: docker build --platform linux/amd64 --pull --tag brightdesk-electron-builder:24.22.2-windows --file .github/docker/electron-builder-windows.Dockerfile .

      - name: Build Windows suite and all ten product installers
        env:
          WIN_CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          bash scripts/build-in-docker.sh win
          node scripts/collect-platform-build.js win

      - name: Build Linux suite and all ten product installers
        env:
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
        shell: bash
        run: |
          bash scripts/build-in-docker.sh linux
          node scripts/collect-platform-build.js linux

      - name: Build macOS suite and all ten product installers
        env:
          MAC_APP_CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.MAC_APP_CSC_LINK || '' }}
          MAC_APP_CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MAC_APP_CSC_KEY_PASSWORD || '' }}
          MAC_INSTALLER_CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          MAC_INSTALLER_CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MAC_INSTALLER_CSC_KEY_PASSWORD || '' }}
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.MAC_APP_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MAC_APP_CSC_KEY_PASSWORD || '' }}
          CSC_INSTALLER_LINK: ${{ github.event_name != 'pull_request' && secrets.MAC_INSTALLER_CSC_LINK || '' }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MAC_INSTALLER_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          if [ -z "${CSC_INSTALLER_LINK:-}" ]; then unset CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD; fi
          npm run dist:mac
          npm run release:prepare -- mac
          npm run release:verify:mac
          npm run dist:products:mac
          npm run release:verify:products:mac
          node scripts/collect-platform-build.js mac

      - name: Verify the complete local installer bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d release/Linux
          test -d release/Windows
          test -d release/macOS
          test -f release/Linux/Brightdesk-SHA256SUMS-LINUX.txt
          test -f release/Windows/Brightdesk-SHA256SUMS-WIN.txt
          test -f release/macOS/Brightdesk-SHA256SUMS-MAC.txt
          for platform in Linux Windows macOS; do
            test -d "release/apps/$platform"
            count=$(find "release/apps/$platform" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
            test "$count" = "10"
          done
          mkdir -p release/build-metadata
          cp package-lock.json release/build-metadata/package-lock.json

      - name: Save verified build output on this Mac
        shell: bash
        run: |
          set -euo pipefail
          destination="$HOME/Brightdesk-Builds/Brightdesk-0.1.0-${GITHUB_RUN_ID}"
          mkdir -p "$destination"
          cat > release/build-metadata/BUILD-REPORT.txt <<EOF
          Brightdesk 0.1.0 installer build
          GitHub Actions run: ${GITHUB_RUN_ID}
          Source branch: ${GITHUB_REF_NAME}
          Node.js: $(node --version)
          Linux: x86_64 AppImage and deb installers for the suite and all ten products
          Windows: x64 NSIS exe installers for the suite and all ten products
          macOS: universal dmg, pkg and zip installers for the suite and all ten products
          Verification: suite and all ten product installer checks passed on all three platforms
          Artifact policy: upload the product repository bundle and three verified platform bundles; release publication remains manual
          EOF
          cp release/build-metadata/BUILD-REPORT.txt "$destination/BUILD-REPORT.txt"
          ditto release "$destination/release"
          ditto -c -k --sequesterRsrc --keepParent "$destination/release" "$destination/Brightdesk-0.1.0-Installers.zip"
          test -s "$destination/Brightdesk-0.1.0-Installers.zip"
          echo "Brightdesk installers saved to: $destination"

      - name: Upload verified Linux installer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brightdesk-0.1.0-Linux
          path: |
            release/Linux/**
            release/apps/Linux/**
            release/build-metadata/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified Windows installer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brightdesk-0.1.0-Windows
          path: |
            release/Windows/**
            release/apps/Windows/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified macOS installer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brightdesk-0.1.0-macOS
          path: |
            release/macOS/**
            release/apps/macOS/**
          if-no-files-found: error
          retention-days: 30


  publish-release:
    name: Publish approved Brightdesk release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      - name: Check out the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up required Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Refusing to publish $RELEASE_TAG; this source version requires $expected_tag." >&2
            exit 1
          fi

      - name: Download verified platform bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Brightdesk-0.1.0-*
          path: release
          merge-multiple: true

      - name: Verify downloaded release contents
        shell: bash
        run: |
          set -euo pipefail
          test -f release/Linux/Brightdesk-SHA256SUMS-LINUX.txt
          test -f release/Windows/Brightdesk-SHA256SUMS-WIN.txt
          test -f release/macOS/Brightdesk-SHA256SUMS-MAC.txt
          for platform in Linux Windows macOS; do
            count=$(find "release/apps/$platform" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
            test "$count" = "10"
          done

      - name: Publish verified desktop installers
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Brightdesk ${{ inputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Linux/**
            release/Windows/**
            release/macOS/**
            release/apps/**

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brightdesk Notes</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="notes-container">
    <aside class="notes-sidebar">
      <div class="sidebar-header">
        <h2>Workspace</h2>
        <button class="new-note-btn">+ New Note</button>
      </div>
      <ul class="notes-list">
        <li class="note-item active">Getting Started</li>
        <li class="note-item">Product Roadmap</li>
        <li class="note-item">Meeting Notes - Q3</li>
        <li class="note-item">Design Guidelines</li>
      </ul>
    </aside>
    <main class="notes-canvas">
      <div class="note-content" contenteditable="true">
        <h1 class="note-title">Getting Started with Notes</h1>
        <div class="note-meta">Last edited today at 4:55 AM</div>
        <p class="note-body">Capture thoughts, meeting agendas, and project specs with clean formatting and instant search.</p>
      </div>
    </main>
  </div>
</body>
</html>
